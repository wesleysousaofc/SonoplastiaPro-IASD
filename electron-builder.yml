# ============================================================
#  SonoplastiaPro - IASD  ·  configuração do instalador
#  ⚠ Troque "SEU_USUARIO" pelo seu usuário do GitHub (e o nome do repositório, se for outro).
#    É daqui que o programa busca as atualizações automáticas.
# ============================================================
appId: br.iasd.sonoplastiapro
productName: SonoplastiaPro - IASD
copyright: Copyright © IASD
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources/bin
    to: bin
  - from: build/icon.ico
    to: icon.ico
  - from: resources/changelog.json
    to: changelog.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SonoplastiaPro - IASD
  artifactName: SonoplastiaPro-IASD-Setup-${version}.${ext}
portable:
  artifactName: SonoplastiaPro-IASD-Portable-${version}.${ext}
publish:
  provider: github
  owner: SEU_USUARIO
  repo: SonoplastiaPro-IASD
  releaseType: release
